syntax = "proto3";

package notifications.v1;

option csharp_namespace = "Notifications.Contracts.V1";

import "google/protobuf/timestamp.proto";

service NotificationService {
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);

  rpc GetNotification(GetNotificationRequest) returns (Notification);

  rpc GetNotificationHistory(NotificationHistoryRequest) returns (NotificationHistoryResponse);

  rpc StreamNotifications(StreamNotificationsRequest) returns (stream Notification);
}

message Notification {
  string id = 1;
  string recipient_id = 2;
  string title = 3;
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
}

message SendNotificationRequest {
  string recipient_id = 1;
  string title = 2;
  string body = 3;
}

message SendNotificationResponse {
  Notification notification = 1;
}

message GetNotificationRequest {
  string id = 1;
}

message NotificationHistoryRequest {
  string recipient_id = 1;
  optional int32 max_results = 2;
}

message NotificationHistoryResponse {
  repeated Notification notifications = 1;
}

message StreamNotificationsRequest {
  string recipient_id = 1;
}
